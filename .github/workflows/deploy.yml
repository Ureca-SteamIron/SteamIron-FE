name: Frontend Dev Deploy

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    # m40327에 설치한 self-hosted 러너에서 실행 (빌드가 이 기계 위에서 돎)
    runs-on: [ self-hosted, Windows ]

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 패키지 설치 및 빌드
        run: |
          npm ci
          npm run build

      - name: 4. 빌드 결과물을 서빙 폴더로 복사
        shell: powershell
        run: |
          $dest = "C:/Users/student/Desktop/SteamIron/dist"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Remove-Item -Path "$dest/*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "dist/*" -Destination $dest -Recurse -Force
          Write-Host "배포 완료 -> $dest"
